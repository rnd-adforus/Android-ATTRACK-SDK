[versions]
# Same toolchain line as the SDK itself (AGP 8.9 / Kotlin 2.0).
agp = "8.9.2"
kotlin = "2.0.21"
attrack = "0.5.0"
installreferrer = "2.2"
work = "2.10.5"
adsIdentifier = "18.3.0"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
junit = "4.13.2"

[libraries]
attrack-tracker = { group = "kr.co.attrack", name = "attrack-tracker", version.ref = "attrack" }
# Only needed for the bare-AAR route: an AAR carries no transitive dependencies.
installreferrer = { group = "com.android.installreferrer", name = "installreferrer", version.ref = "installreferrer" }
work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
# Optional. Lets the SDK read the GAID after the user grants advertising consent.
play-services-ads-identifier = { group = "com.google.android.gms", name = "play-services-ads-identifier", version.ref = "adsIdentifier" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
