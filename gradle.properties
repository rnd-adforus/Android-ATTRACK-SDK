org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Per-app values. Do NOT put real values here: this file is committed.
# Put them in local.properties (git-ignored), ~/.gradle/gradle.properties,
# environment variables (ATTRACK_PACKAGE_NAME / ATTRACK_APP_ID / ATTRACK_CLIENT_KEY) or -P flags.
#
#   attrack.appId=app_xxxxxxxxxxxxxxxxxxxxxxxx   # App ID issued for your app
#   attrack.clientKey=...                         # client key issued for your app
#
# Deep-link host. It must equal the endpoint compiled into the SDK you use:
# api.attrack.co.kr.
attrack.linkScheme=https
attrack.linkHost=api.attrack.co.kr
